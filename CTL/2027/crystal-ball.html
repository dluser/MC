  :root {
    --ivory: #f4ead6;
    --gold: #e6c98a;
    --gold-dim: rgba(230, 201, 138, 0.72);
    --night: #06020d;
    --ball: min(70vw, 52vh, 600px);
    --serif: "Cormorant", Georgia, "Times New Roman", serif;
    --sans: "Jost", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse 80% 70% at 50% 45%, #261046 0%, #140724 48%, var(--night) 100%);
    color: var(--ivory);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #stars, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #stars { z-index: 0; }
  #fx { z-index: 6; }

  /* Drifting fog */
  .fog {
    position: fixed; inset: 0; pointer-events: none;
    background-repeat: repeat-x;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 45%, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 45%, #000 100%);
  }
  .fog.back  { z-index: 1; opacity: 0.55; background-size: 2200px 100%; animation: drift 150s linear infinite; }
  .fog.mid   { z-index: 1; opacity: 0.35; background-size: 1500px 80%; background-position-y: 100%; animation: drift2 95s linear infinite; }
  .fog.front { z-index: 5; opacity: 0.22; background-size: 2800px 55%; background-position-y: 100%; animation: drift3 120s linear infinite reverse; }
  @keyframes drift  { from { background-position-x: 0; } to { background-position-x: -2200px; } }
  @keyframes drift2 { from { background-position-x: 0; } to { background-position-x: -1500px; } }
  @keyframes drift3 { from { background-position-x: 0; } to { background-position-x: -2800px; } }

  .wrap {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.6vmin; padding: 16px;
  }

  header { text-align: center; }
  .eyebrow {
    font-family: var(--sans); font-weight: 400;
    font-size: clamp(11px, 1.6vmin, 15px); letter-spacing: 0.5em; text-transform: uppercase;
    color: var(--gold-dim); padding-left: 0.5em;
  }
  h1 {
    margin: 0.25em 0 0; font-family: var(--serif); font-weight: 500;
    font-size: clamp(28px, 5.6vmin, 60px); letter-spacing: 0.01em; line-height: 1.05;
    color: var(--ivory);
    text-shadow: 0 0 30px rgba(190, 140, 255, 0.35);
  }
  h1 em { font-style: italic; color: var(--gold); }

  .orb {
    position: relative; display: block;
    width: var(--ball); height: calc(var(--ball) * 1.18);
    padding: 0; margin: 0; border: 0; background: none; cursor: pointer;
    -webkit-appearance: none; appearance: none; outline: none;
  }
  .orb:focus-visible { outline: none; }
  #ball { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Soft glow behind the glass */
  .aura {
    position: absolute; left: 50%; top: calc(var(--ball) * 0.47);
    width: calc(var(--ball) * 1.5); height: calc(var(--ball) * 1.5);
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(160, 100, 255, 0.28) 0%, rgba(110, 50, 200, 0.12) 38%, transparent 66%);
    transition: opacity 1.2s ease, transform 1.4s ease; opacity: 0.8;
    animation: auraPulse 5s ease-in-out infinite;
    pointer-events: none;
  }
  .orb.active .aura { opacity: 1; transform: translate(-50%, -50%) scale(1.15);
    background: radial-gradient(circle, rgba(255, 215, 160, 0.30) 0%, rgba(170, 100, 255, 0.22) 38%, transparent 68%); }
  @keyframes auraPulse { 0%, 100% { filter: brightness(0.85); } 50% { filter: brightness(1.15); } }

  .fortune {
    position: absolute; left: 50%; top: calc(var(--ball) * 0.47);
    width: calc(var(--ball) * 0.62); height: calc(var(--ball) * 0.62);
    transform: translate(-50%, -50%) scale(0.94);
    margin: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: var(--serif); font-style: normal; font-weight: 500;
    font-size: calc(var(--ball) * 0.066); line-height: 1.2; letter-spacing: 0.005em;
    text-wrap: balance; -webkit-hyphens: none; hyphens: none;
    color: #fff8ea;
    text-shadow: 0 0 4px rgba(40, 10, 70, 0.9), 0 0 18px rgba(255, 215, 160, 0.75), 0 0 36px rgba(190, 130, 255, 0.6);
    opacity: 0; filter: blur(12px);
    transition: opacity 1.4s ease, filter 1.4s ease, transform 1.8s ease;
    pointer-events: none;
  }
  .fortune::before {
    content: ""; position: absolute; inset: -12%; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, rgba(20, 5, 40, 0.55) 0%, rgba(20, 5, 40, 0.3) 45%, transparent 70%);
  }
  html:not(.no-gl) .fortune { opacity: 0 !important; }
  .orb.hover .aura { transform: translate(-50%, -50%) scale(1.07); opacity: 1; }
  .fortune { z-index: 2; }
  .no-gl .orb::after { z-index: 1; }
  .fortune.long { font-size: calc(var(--ball) * 0.058); }
  .fortune.show { opacity: 1; filter: blur(0); transform: translate(-50%, -50%) scale(1); }
  .fortune.vanish {
    opacity: 0; filter: blur(18px); transform: translate(-50%, -58%) scale(1.1);
    transition: opacity 1s ease, filter 1s ease, transform 1.3s ease;
  }

  .prompt {
    margin: 0; font-family: var(--sans); font-weight: 300;
    font-size: clamp(12px, 1.9vmin, 19px); letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--ivory); text-align: center; padding-left: 0.32em;
    animation: breathe 3.4s ease-in-out infinite;
    transition: opacity 0.6s;
  }
  #pointers { position: fixed; z-index: 3; pointer-events: none; transition: opacity 0.6s; }
  #pointers.hidden, .no-gl #pointers { opacity: 0; }
  @media (max-width: 900px) { .prompt { letter-spacing: 0.18em; padding-left: 0.18em; } }
  .prompt.hidden { opacity: 0 !important; animation-play-state: paused; }
  @keyframes breathe { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.95; } }

  .brand {
    position: fixed; left: 22px; bottom: 18px; z-index: 7;
    display: flex; align-items: center; gap: 14px; opacity: 0.8;
  }
  .brand svg { height: 34px; width: auto; display: block; }
  .brand img { height: 30px; width: auto; display: block; }
  .brand .divider { width: 1px; height: 26px; background: rgba(244, 234, 214, 0.35); }

  .fs {
    position: fixed; right: 12px; top: 12px; z-index: 7;
    width: 34px; height: 34px; border-radius: 8px; border: 0;
    background: rgba(255, 255, 255, 0.04); color: var(--gold-dim);
    opacity: 0.3; cursor: pointer; display: grid; place-items: center;
  }
  .fs:hover { opacity: 0.8; }

  /* Fallback if WebGL is unavailable */
  .no-gl #ball { display: none; }
  .no-gl .orb::after {
    content: ""; position: absolute; left: 50%; top: calc(var(--ball) * 0.47);
    width: calc(var(--ball) * 0.84); height: calc(var(--ball) * 0.84); transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, rgba(255,255,255,0.35), transparent 22%),
                radial-gradient(circle at 50% 60%, #7a4cc0, #2a0f52 60%, #0d0420);
  }
</style>

<script id="pointerFrag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes, uC0, uC1;
uniform float uTime, uS, uP0, uP1, uB0, uB1;
uniform vec2 uPoly[7];

float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float sdPoly(vec2 p) {
  float d = dot(p - uPoly[0], p - uPoly[0]);
  float s = 1.0;
  for (int i = 0; i < 7; i++) {
    int jn = i == 0 ? 6 : i - 1;
    vec2 vi = uPoly[0], vj = uPoly[0];
    for (int k = 0; k < 7; k++) { if (k == i) vi = uPoly[k]; if (k == jn) vj = uPoly[k]; }
    vec2 e = vj - vi, w = p - vi;
    vec2 b = w - e * clamp(dot(w, e) / dot(e, e), 0.0, 1.0);
    d = min(d, dot(b, b));
    bvec3 c = bvec3(p.y >= vi.y, p.y < vj.y, e.x * w.y > e.y * w.x);
    if (all(c) || all(not(c))) s *= -1.0;
  }
  return s * sqrt(d);
}
mat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0.0, -s, 0.0, 1.0, 0.0, s, 0.0, c); }
mat3 rotX(float a) { float c = cos(a), s = sin(a); return mat3(1.0, 0.0, 0.0, 0.0, c, s, 0.0, -s, c); }
mat3 M;
float mapA(vec3 q) {
  q = M * q;
  float d2 = sdPoly(q.xy) + 0.07;
  vec2 w = vec2(d2, abs(q.z) - 0.08);
  return min(max(w.x, w.y), 0.0) + length(max(w, 0.0)) - 0.075;
}
vec3 nrm(vec3 p) {
  const vec2 k = vec2(1.0, -1.0); const float e = 0.002;
  return normalize(k.xyy * mapA(p + k.xyy * e) + k.yyx * mapA(p + k.yyx * e) + k.yxy * mapA(p + k.yxy * e) + k.xxx * mapA(p + k.xxx * e));
}
float panel(vec3 d, vec3 dir, vec2 size) {
  float z = dot(d, dir); if (z <= 0.0) return 0.0;
  vec3 r = normalize(cross(dir, vec3(0.0, 1.0, 0.0))), u = cross(r, dir);
  vec2 q = vec2(dot(d, r), dot(d, u)) / z;
  float dd = length(max(abs(q) - size + 0.05, 0.0)) - 0.05;
  return 1.0 - smoothstep(-0.03, 0.12, dd);
}
vec3 env(vec3 d) {
  vec3 c = mix(vec3(0.05, 0.025, 0.08), vec3(0.20, 0.12, 0.26), smoothstep(-0.4, 0.9, d.y));
  c += vec3(1.0, 0.94, 0.84) * 2.2 * panel(d, normalize(vec3(-0.5, 0.65, 0.6)), vec2(0.35, 0.22));
  c += vec3(0.65, 0.5, 1.0) * 0.9 * panel(d, normalize(vec3(0.8, 0.1, 0.45)), vec2(0.08, 0.6));
  c += vec3(1.0, 0.8, 0.5) * 0.5 * panel(d, normalize(vec3(0.0, -0.6, 0.8)), vec2(0.6, 0.12));
  // broad warm light behind the viewer, so the gold face glows; brighter toward the top
  c += vec3(1.0, 0.84, 0.58) * (0.55 + 0.6 * smoothstep(-0.3, 0.5, d.y)) * smoothstep(0.35, 0.95, d.z);
  return c;
}
vec4 arrow(vec2 frag, vec2 c, float mirror, float pulse) {
  vec2 p2 = (frag - c) / uS;
  if (mirror > 0.5) p2.x = -p2.x;
  if (abs(p2.x) > 1.25 || abs(p2.y) > 1.15) return vec4(0.0);
  // the right-hand pointer is rendered in mirrored space; its normal is flipped back below
  M = rotY(0.34) * rotX(-0.22);
  vec3 ro = vec3(p2, 2.0), rd = vec3(0.0, 0.0, -1.0);
  float t = 0.0; bool hit = false;
  for (int i = 0; i < 48; i++) {
    float d = mapA(ro + rd * t);
    if (d < 0.0008) { hit = true; break; }
    t += d; if (t > 4.0) break;
  }
  // soft drop shadow behind the arrow
  vec2 sp = p2 - vec2(0.10, -0.16);
  float shadow = (1.0 - smoothstep(-0.12, 0.22, sdPoly(sp))) * 0.42;
  // gentle gold glow that breathes with the pulse
  float glowD = sdPoly(p2);
  float glow = exp(-max(glowD, 0.0) * 9.0) * (0.10 + 0.30 * pulse);
  vec4 under = vec4(vec3(1.0, 0.78, 0.42) * glow, max(shadow, glow * 0.8));
  if (!hit) return under;
  vec3 n = nrm(ro + rd * t);
  if (mirror > 0.5) n.x = -n.x;
  vec3 rdw = rd;
  vec3 gold = vec3(1.0, 0.76, 0.34);
  float ci = clamp(dot(-rdw, n), 0.0, 1.0);
  vec3 F = gold + (1.0 - gold) * pow(1.0 - ci, 5.0);
  vec3 r = reflect(rdw, n);
  vec3 col = env(r) * F;
  vec3 K = normalize(vec3(-0.5, 0.65, 0.6));
  vec3 H = normalize(K - rdw);
  col += gold * 0.18 * max(dot(n, K), 0.0);
  col += F * (pow(max(dot(n, H), 0.0), 90.0) * 2.4 + pow(max(dot(n, H), 0.0), 14.0) * 0.25);
  // glitter: tiny facets that catch the light and twinkle
  vec3 gq = (M * (ro + rd * t)) * 30.0;
  float h = hash(floor(gq));
  if (h > 0.90) {
    vec3 f = fract(gq) - 0.5;
    float tw = 0.5 + 0.5 * sin(uTime * (2.5 + h * 6.0) + h * 50.0);
    col += vec3(1.0, 0.95, 0.82) * exp(-dot(f, f) * 22.0) * pow(tw, 8.0) * 2.2;
  }
  col *= 0.78 + 0.42 * pulse;
  col = 1.0 - exp(-col * 1.35);
  return vec4(col, 1.0);
}
void main() {
  vec2 f = gl_FragCoord.xy;
  vec4 a = arrow(f, uC0 + vec2(uB0, 0.0), 0.0, uP0);
  if (a.a < 0.001) a = arrow(f, uC1 - vec2(uB1, 0.0), 1.0, uP1);
  gl_FragColor = a;
}
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime, uGlow, uSwirl, uFocal, uRP;
uniform vec2 uShift;
uniform sampler2D uTextTex;
uniform float uTextAmt, uHover;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
                 mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                 mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p) {
  float v = 0.0, a = 0.55;
  for (int i = 0; i < 3; i++) { v += a * noise(p); p = p * 2.03 + vec3(1.7, 9.2, 4.1); a *= 0.5; }
  return v;
}

// ---- Studio environment: dark violet room, two soft lights, faint stars ----
float softRect(vec2 q, vec2 b, float r) {
  float d = length(max(abs(q) - b + r, 0.0)) - r;
  float core = 1.0 - smoothstep(-0.03, 0.10, d);
  float bloom = exp(-max(d, 0.0) * 9.0) * 0.12;
  // brighter toward the top edge, like a window
  return core * (0.65 + 0.35 * smoothstep(-b.y, b.y, q.y)) + bloom;
}
float lightPanel(vec3 d, vec3 dir, vec2 size) {
  float z = dot(d, dir);
  if (z <= 0.0) return 0.0;
  vec3 r = normalize(cross(dir, vec3(0.0, 1.0, 0.0)));
  vec3 u = cross(r, dir);
  vec2 q = vec2(dot(d, r), dot(d, u)) / z;
  return softRect(q, size, min(size.x, size.y) * 0.6);
}
vec3 env(vec3 d) {
  vec3 c = mix(vec3(0.012, 0.006, 0.028), vec3(0.085, 0.040, 0.150), smoothstep(-0.25, 0.9, d.y));
  c += vec3(0.05, 0.02, 0.09) * exp(-abs(d.y) * 6.0);
  c += vec3(1.00, 0.93, 0.85) * 2.6 * lightPanel(d, normalize(vec3(-0.55, 0.62, 0.56)), vec2(0.20, 0.13));
  c += vec3(1.0, 0.95, 0.9) * 3.0 * lightPanel(d, normalize(vec3(0.42, 0.75, 0.52)), vec2(0.035, 0.035));
  c += vec3(0.55, 0.45, 1.00) * 1.4 * lightPanel(d, normalize(vec3(0.88, 0.18, -0.45)), vec2(0.05, 0.50));
  c += vec3(0.95, 0.55, 0.80) * 0.5 * lightPanel(d, normalize(vec3(-0.80, 0.05, -0.60)), vec2(0.04, 0.35));
  vec3 sp = d * 85.0;
  float h = hash(floor(sp));
  if (h > 0.995) { vec3 f = fract(sp) - 0.5; c += vec3(1.0, 0.95, 0.88) * exp(-dot(f, f) * 30.0) * (h - 0.995) * 160.0; }
  return c;
}

// ---- Brass stand (signed distance field) ----
float sdTorus(vec3 p, vec2 t) { vec2 q = vec2(length(p.xz) - t.x, p.y); return length(q) - t.y; }
float sdCappedCone(vec3 p, float h, float r1, float r2) {
  vec2 q = vec2(length(p.xz), p.y);
  vec2 k1 = vec2(r2, h);
  vec2 k2 = vec2(r2 - r1, 2.0 * h);
  vec2 ca = vec2(q.x - min(q.x, (q.y < 0.0) ? r1 : r2), abs(q.y) - h);
  vec2 cb = q - k1 + k2 * clamp(dot(k1 - q, k2) / dot(k2, k2), 0.0, 1.0);
  float s = (cb.x < 0.0 && ca.y < 0.0) ? -1.0 : 1.0;

        const g = fctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
        g.addColorStop(0, `rgba(255,225,190,${a})`); g.addColorStop(0.35, `rgba(190,140,255,${a * 0.45})`); g.addColorStop(1, "rgba(150,100,230,0)");
        fctx.globalAlpha = 1; fctx.fillStyle = g; fctx.fillRect(0, 0, W, H);
      } else if (p.type === "ring") {
        // soft expanding wave of light (a blurred band, no hard outline)
        fctx.globalCompositeOperation = "lighter";
        const e = 1 - Math.pow(1 - u, 3);
        const R = p.r * (1.0 + e * (p.soft ? 3.0 : 2.2));
        const wdt = p.r * (p.soft ? 0.9 : 0.45) * (0.6 + e);
        const a = Math.pow(1 - u, 2) * (p.soft ? 0.10 : 0.16);
        const r0 = Math.max(0, R - wdt), r1 = R + wdt;
        const g = fctx.createRadialGradient(p.x, p.y, r0, p.x, p.y, r1);
        g.addColorStop(0, "rgba(255,225,185,0)");
        g.addColorStop(0.5, `rgba(255,225,185,${a})`);
        g.addColorStop(0.62, `rgba(205,160,255,${a * 0.6})`);
        g.addColorStop(1, "rgba(190,140,255,0)");
        fctx.globalAlpha = 1; fctx.fillStyle = g;
        fctx.beginPath(); fctx.arc(p.x, p.y, r1, 0, Math.PI * 2); fctx.fill();
      } else if (p.type === "mote") {
        const fadeIn = Math.min(1, p.life / 8);
        const tw = 0.55 + 0.45 * Math.sin(p.life * p.tw + p.ph);
        const a = Math.min(1, fadeIn * Math.pow(1 - u, 1.1) * tw * 1.25);
        if (a <= 0.003) continue;
        fctx.globalCompositeOperation = "lighter";
        const bs = p.size * 13;
        fctx.globalAlpha = 0.75 * a;
        fctx.drawImage(bloom, p.x - bs / 2, p.y - bs / 2, bs, bs);
        fctx.globalAlpha = a;
        fctx.fillStyle = p.warm ? "rgba(255,246,228,1)" : "rgba(232,220,255,1)";
        fctx.beginPath(); fctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2); fctx.fill();
      } else if (p.type === "bokeh") {
        const a = p.peak * Math.sin(Math.PI * u);
        fctx.globalCompositeOperation = "lighter";
        const g = fctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        const rgb = p.warm ? "255,220,170" : "205,170,255";
        g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.7, `rgba(${rgb},${a * 0.6})`); g.addColorStop(1, `rgba(${rgb},0)`);
        fctx.globalAlpha = 1; fctx.fillStyle = g;
        fctx.beginPath(); fctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); fctx.fill();
      } else {
        // curve, slow down, drift upward
        const cs = Math.cos(p.turn * k), sn = Math.sin(p.turn * k);
        const vx = p.vx * cs - p.vy * sn, vy = p.vx * sn + p.vy * cs;
        const damp = Math.pow(p.drag || 0.972, k);
        p.vx = vx * damp; p.vy = vy * damp - 0.012 * k;
        const fadeIn = Math.min(1, p.life / 6);
        const flick = 0.72 + 0.28 * Math.sin(p.life * p.tw + p.ph);
        const a = fadeIn * Math.pow(1 - u, 1.6) * flick;
        if (a <= 0.003) continue;
        const col = p.cool ? [220, 196, 255] : [255, 226 - 40 * u, 180 - 70 * u];
        const rgb = `${col[0] | 0},${col[1] | 0},${col[2] | 0}`;
        fctx.globalCompositeOperation = "lighter";
        // motion streak
        const tl = 5.5;
        const tx = p.x - p.vx * tl, ty = p.y - p.vy * tl;
        const g = fctx.createLinearGradient(p.x, p.y, tx, ty);
        g.addColorStop(0, `rgba(${rgb},${0.9 * a})`); g.addColorStop(1, `rgba(${rgb},0)`);
        fctx.globalAlpha = 1; fctx.strokeStyle = g; fctx.lineWidth = p.size; fctx.lineCap = "round";
        fctx.beginPath(); fctx.moveTo(p.x, p.y); fctx.lineTo(tx, ty); fctx.stroke();
        // soft bloom + hot core
        const bs = p.size * 12 * (0.85 + 0.15 * flick);
        fctx.globalAlpha = 0.55 * a;
        fctx.drawImage(bloom, p.x - bs / 2, p.y - bs / 2, bs, bs);
        fctx.globalAlpha = a;
        fctx.fillStyle = "rgba(255,250,240,1)";
        fctx.beginPath(); fctx.arc(p.x, p.y, p.size * 0.55, 0, Math.PI * 2); fctx.fill();
      }
    }
    fctx.globalAlpha = 1; fctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- Reveal sequence ----------
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let busy = false, wakeLock = null;
  async function keepAwake() {
    try { if (!wakeLock && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { wakeLock = null; keepAwake(); } });

  async function reveal() {
    if (busy) return;
    busy = true;
    audio(); keepAwake();
    promptEl.classList.add("hidden");
    ptrCv.classList.add("hidden");
    orb.classList.add("active");
    glowTarget = 1;
    chime();
    sparkBurst();

    const text = nextFortune();
    try { await document.fonts.load("500 100px Cormorant"); } catch (e) {}
    if (glOK) uploadText(text);
    fortuneEl.textContent = text;
    fortuneEl.classList.toggle("long", text.length > 72);
    fortuneEl.classList.remove("vanish");
    await wait(800);
    textTarget = 1;
    startGlitter();
    fortuneEl.classList.add("show");

    await wait(Math.min(9000, 4200 + text.length * 55));

    whoosh();
    smokeBurst();
    await wait(300);
    textTarget = 0;
    stopGlitter();
    fortuneEl.classList.add("vanish");
    fortuneEl.classList.remove("show");
    glowTarget = 0;
    orb.classList.remove("active");

    await wait(1800);
    fortuneEl.classList.remove("vanish");
    fortuneEl.textContent = "";
    promptEl.classList.remove("hidden");
    ptrCv.classList.remove("hidden");
    await wait(400);
    busy = false;
  }
  orb.addEventListener("click", reveal);
  orb.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") { hoverTarget = 1; orb.classList.add("hover"); } });
  orb.addEventListener("pointerleave", () => { hoverTarget = 0; orb.classList.remove("hover"); });

  // ---------- Full screen ----------
  function toggleFullscreen() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    const active = document.fullscreenElement || document.webkitFullscreenElement;
    try { active ? exit.call(document) : req && req.call(el); } catch (e) {}
  }
  document.getElementById("fsBtn").addEventListener("click", toggleFullscreen);
  document.addEventListener("keydown", e => { if (e.key === "f" || e.key === "F") toggleFullscreen(); });

})();
</script>
