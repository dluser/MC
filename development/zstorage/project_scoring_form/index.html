<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LXD Project Complexity Scoring</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--accent:#0f62fe;--muted:#6b7280}
    body{font-family:Inter,Segoe UI,Roboto,Arial; background:var(--bg); margin:0; padding:24px; color:#111}
    .container{max-width:900px;margin:0 auto;}
    .left{}
    .right{}
    header{margin-bottom:18px}
    h1{font-size:18px;margin:0 0 8px 0}
    .card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 6px 18px rgba(12,20,40,0.06);margin-bottom:16px}
    .input-row{display:flex;gap:12px;margin-bottom:12px}
    .input-row input{flex:1;padding:8px;border:1px solid #ccc;border-radius:8px}
    .radio-row{display:flex;gap:8px;flex-wrap:wrap}
    .radio{background:#f3f6fb;border:1px solid #e6eefb;padding:8px 10px;border-radius:8px;cursor:pointer;min-width:34px;text-align:center}
    .radio input{display:none}
    .radio.selected{background:linear-gradient(90deg,#eef6ff,#ffffff);border-color:var(--accent);box-shadow:0 4px 10px rgba(15,98,254,0.08)}
    footer{margin-top:12px;display:flex;gap:10px;align-items:center}
    button{cursor:pointer;padding:8px 14px;border-radius:8px;border:none}
    #exportPdf{background:var(--accent);color:white}
    #reset{background:#ddd}
    .tier-box{background:#eef3ff;border-left:4px solid var(--accent);padding:12px;border-radius:8px;margin-top:12px}
    .summary-item{margin-bottom:12px;font-size:14px}
    .summary-item strong{display:block;margin-bottom:4px}
  </style>
</head>
<body>
  <div class="container">

    <!-- LEFT -->
    <div class="left">
      <header>
        <div class="card" style="text-align:center;">
          <h1 style="margin:0;">LXD Project Scoring Form</h1>
        </div>
        <div class="card">
          <div class="input-row">
            <input id="projectName" placeholder="Project Name" />
            <input id="smeName" placeholder="SME / Faculty" />
            <input id="projectDate" type="date" />
          </div>
        </div>
      </header>

      <div class="card" id="formCard">
        <form id="scoringForm">
          <div style="margin-top:12px;display:grid;gap:18px">

            <div>
              <label>1) Media & Interactivity Complexity</label>
              <div class="radio-row" data-name="media"></div>
            </div>
            <div>
              <label>2) Faculty Readiness & Collaboration</label>
              <div class="radio-row" data-name="faculty"></div>
            </div>
            <div>
              <label>3) Timeline & Resource Intensity</label>
              <div class="radio-row" data-name="timeline"></div>
            </div>
            <div>
              <label>4) Review & Revision Requirements</label>
              <div class="radio-row" data-name="review"></div>
            </div>
            <div>
              <label>5) Technical Integration Needs</label>
              <div class="radio-row" data-name="technical"></div>
            </div>

          </div>
        </form>

        <footer>
          <div class="score">Total Score: <span id="total">0</span></div>
        </footer>
      </div>
    </div>

    <!-- RIGHT SUMMARY -->
    <div class="right">
      <div class="card">
        <h3>Selected Criteria Summary</h3>
        <div id="summary"></div>
      </div>
      <div class="tier-box">
        <h3>Complexity Tier</h3>
        <div id="tierText">—</div>
      </div>
    </div>

    <!-- BUTTON CARD -->
    <div class="card" style="text-align:center; margin-top:20px;">
      <button id="reset" type="button" style="background:#ddd; margin-right:10px;">Reset</button>
      <button id="exportPdf" type="button" style="background:var(--accent); color:white;">Save as PDF</button>
    </div>

  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const hoverMap = {
  media:{1:'Simple static content (text, images, or slides).',2:'Some video or audio; light interactivity (e.g., quizzes).',3:'Multi-media mix (video, H5P, graphics).',4:'Advanced media or animations requiring storyboarding.',5:'Complex or immersive media (VR/360, simulations, branching).'},
  faculty:{1:'Faculty fully independent, clear scope, minimal meetings.',2:'Some LXD support needed for design planning.',3:'Moderate support with iterative collaboration.',4:'Significant coaching or coordination required.',5:'Faculty highly dependent on LXD for design, scripting, or tool use.'},
  timeline:{1:'Single deliverable, <5 hours estimated work.',2:'Small project, minimal assets.',3:'Standard project (10–20 hours).',4:'Extended design or media development time (20–40 hours).',5:'Long-term project (>40 hours) or multi-phase design effort.'},
  review:{1:'One quick approval or upload.',2:'Minor feedback adjustments.',3:'Moderate faculty review and iteration.',4:'Multiple revision rounds or testing sessions.',5:'Ongoing revisions, testing, and long-term evaluation required.'},
  technical:{1:'Uses existing LMS tools, no customization.',2:'Minor D2L or media integration.',3:'Requires support for new tools (e.g., H5P setup).',4:'Advanced setup or cross-platform compatibility (AI tools, HTML templates).',5:'Custom builds, new system integrations, or grant-funded experimental tools.'}
};

// Build radio buttons
document.querySelectorAll('.radio-row').forEach(container=>{
  const name=container.dataset.name;
  for(let i=1;i<=5;i++){
    const el=document.createElement('label');
    el.className='radio';
    const tip=hoverMap[name]?.[i]||'';
    if(tip) el.title=tip;
    el.innerHTML=`<input type="radio" name="${name}" value="${i}" />${i}`;
    el.addEventListener('click',()=>selectRadio(container,i));
    container.appendChild(el);
  }
});

function selectRadio(container,val){
  container.querySelectorAll('.radio').forEach(r=>r.classList.remove('selected'));
  const chosen=container.querySelectorAll('.radio')[val-1];
  if(chosen){chosen.classList.add('selected');chosen.querySelector('input').checked=true;}
  recalc();
}

function recalc(){
  const keys=['media','faculty','timeline','review','technical'];
  let total=0;
  let summaryHTML="";

  keys.forEach(k=>{
    const sel=document.querySelector(`.radio-row[data-name="${k}"] input:checked`);
    if(sel){
      total+=+sel.value;
      summaryHTML += `<div class='summary-item'><strong>${k.toUpperCase()}</strong>${hoverMap[k][sel.value]}</div>`;
    }
  });

  document.getElementById('total').textContent = total;
  document.getElementById('summary').innerHTML = summaryHTML;

  let tierText = "—";
  if(total>=5 && total<=9) tierText = "LOW: Simple or single‑deliverable project. Minimal LXD coordination. Estimated time: ~5–9 hours.";
  else if(total>=10 && total<=14) tierText = "MODERATE: Standard multi-step design or multimedia project. Estimated time: ~10–20 hours.";
  else if(total>=15 && total<=19) tierText = "HIGH: Significant design, testing, and media creation effort. Estimated time: ~20–40 hours.";
  else if(total>=20 && total<=25) tierText = "INTENSIVE: Multi-phase or cross‑departmental initiative requiring extended development. Estimated time: 40+ hours.";

  document.getElementById('tierText').textContent = tierText;
}

// Reset button
document.getElementById('reset').addEventListener('click',()=>{
  document.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);
  document.querySelectorAll('.radio').forEach(r=>r.classList.remove('selected'));
  document.getElementById('total').textContent='0';
  document.getElementById('summary').innerHTML='';
  document.getElementById('tierText').textContent='—';
});

// Export PDF button
document.getElementById('exportPdf').addEventListener('click',()=>{
  const element = document.querySelector('.container');
  const project = document.getElementById('projectName').value.trim();
  const safeName = project ? project.replace(/[^a-z0-9_\-]+/gi,'_') : 'LXD_Project_Complexity_Scoring';
  const opt = {
    margin: 10,
    filename: safeName + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(element).save();
});
</script>
</body>
</html>
